name: Build MARK LIV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q Mark-LIV-Android-Port.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -name "buildozer.spec" -o -name "*.py"

      - name: Find project
        run: |
          SPEC=$(find project -name buildozer.spec -print -quit)

          if [ -z "$SPEC" ]; then
            echo "buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Fix Android API level
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/requests,pyjnius/requests,pyjnius,charset-normalizer==3.4.3/' buildozer.spec

          if grep -q "^android.minapi" buildozer.spec; then
            sed -i 's/^android.minapi.*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          echo "Android min API:"
          grep "^android.minapi" buildozer.spec || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MARK-LIV-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
