
name: Build MARK APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack and build APK
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'JARVIS-ALL-SYSTEMS-50-COMMANDS-GEMINI-FIX.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MARK-JARVIS-debug-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
